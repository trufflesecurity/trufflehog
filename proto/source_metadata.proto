// MetaData describes where a chunk came from. It is proto2 only so that it can
// declare extension ranges: sources defined outside this repository attach
// their own location messages as extensions instead of requiring a new oneof
// arm here. Because the message holds nothing but a oneof of messages, proto2
// and proto3 generate the same Go API and the same wire bytes for it.
//
// An extension at field N is byte-identical on the wire to a oneof arm at
// field N. A removed arm's number can therefore be redeclared as an extension
// number, and readers on either side of that change keep decoding each other.
syntax = "proto2";

package source_metadata;

option go_package = "github.com/trufflesecurity/trufflehog/v3/pkg/pb/source_metadatapb";

import public "source_metadata_types.proto";

message MetaData {
  oneof data {
    Azure azure = 1;
    Bitbucket bitbucket = 2;
    CircleCI circleci = 3;
    Confluence confluence = 4;
    Docker docker = 5;
    ECR ecr = 6;
    GCS gcs = 7;
    Github github = 8;
    Gitlab gitlab = 9;
    Jira jira = 10;
    NPM npm = 11;
    PyPi pypi = 12;
    S3 s3 = 13;
    Slack slack = 14;
    Filesystem filesystem = 15;
    Git git = 16;
    Test test = 17;
    Buildkite buildkite = 18;
    Gerrit gerrit = 19;
    Jenkins jenkins = 20;
    Teams teams = 21;
    Artifactory artifactory = 22;
    Syslog syslog = 23;
    Forager forager = 24;
    SharePoint sharepoint = 25;
    GoogleDrive googleDrive = 26;
    AzureRepos azureRepos = 27;
    TravisCI travisCI = 28;
    Postman postman = 29;
    Webhook webhook = 30;
    Elasticsearch elasticsearch = 31;
    Huggingface huggingface = 32;
    Sentry sentry = 33;
    Stdin stdin = 34;
    SlackContinuous slackContinuous = 35;
    JSONEnumerator jsonEnumerator = 36;
    AWSSecretsManager awsSecretsManager = 37;
  }

  // Reserved for location messages defined by downstream consumers of these
  // protos. Read and build them through MetaData.Payload and Wrap.
  extensions 1000 to max;
}
